name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (e.g. v0.1.0)'
        required: true
        default: v0.1.0

# Only the release job needs to write; give it an explicit token.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows
            arch: amd64
            asset: codenv-windows-x64.zip
          - name: Windows arm64
            os: windows
            arch: arm64
            asset: codenv-windows-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ github.event_name == 'workflow_dispatch'
                    && inputs.tag || github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: |
          # Read the codename from .github/CODENAMES.txt for this exact tag, so
          # a tag that is not listed simply has no codename.
          $codename = ''
          $map = '.github\CODENAMES.txt'
          if (Test-Path $map) {
            $line = Get-Content $map | Where-Object {
              $_ -match '^\s*v' -and ($_ -split '=')[0].Trim() -eq $env:TAG
            } | Select-Object -First 1
            if ($line) { $codename = ($line -split '=', 2)[1].Trim() }
          }
          $ldflags = "-s -w" +
            " -X github.com/Tijani127/codenv/internal/version.Version=$env:TAG" +
            " -X github.com/Tijani127/codenv/internal/version.Commit=$env:COMMIT" +
            " -X github.com/Tijani127/codenv/internal/version.Date=$env:BUILD_DATE"
          if ($codename) {
            $ldflags += " -X github.com/Tijani127/codenv/internal/version.Codename=$codename"
          }
          go build -trimpath -ldflags $ldflags -o codenv.exe .

      # The Build step stays a pure build: an arm64 binary cannot run on the
      # x64 Windows runner, so only the amd64 job verifies the output. The build
      # workflow does this check for both architectures.
      - name: Self check
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: .\codenv.exe version

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item codenv.exe (Join-Path $stage 'codenv.exe')
          Copy-Item LICENSE, README.md -Destination $stage
          # codenv manages PATH per shell rather than per machine, so there is
          # no installer and nothing to register.
          @'
          # codenv

          This is a portable binary. Put it anywhere on your PATH.

              codenv init          create codenv.json
              codenv add <pkg>     add a package
              codenv install       install what codenv.json pins
              codenv shell         enter the environment

          Requirements: Windows, PowerShell, and git (used to clone Scoop's buckets).
          '@ | Set-Content (Join-Path $stage 'RUN.txt')
          7z a -tzip "${{ matrix.asset }}" "$stage\*"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The codename map lives in the repo, so this job needs a checkout.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch'
                    && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist
          # Same codename map the build step used, so the release title matches
          # what the binary reports. Matched on the exact tag, with no
          # interpolation inside the pattern.
          codename=""
          if [ -f .github/CODENAMES.txt ]; then
            codename=$(grep -F "$TAG=" .github/CODENAMES.txt 2>/dev/null \
                      | grep -v '^[[:space:]]*#' \
                      | head -n 1 | cut -d= -f2- | xargs) || codename=""
          fi
          title="$TAG"
          if [ -n "$codename" ]; then
            title="$TAG $codename"
          fi
          echo "title=$title"
          notes="$(mktemp)"
          {
            if [ -n "$codename" ]; then
              # Braces are required: $codename_ would be read as a different
              # variable name, because '_' is valid inside a shell variable.
              echo "## ${title}"
              echo
              echo "_codenv ${TAG} - ${codename}_"
              echo
            fi
            echo "## Downloads"
            echo
            echo "| Platform | Asset |"
            echo "| --- | --- |"
            echo "| Windows x64 | \`codenv-windows-x64.zip\` |"
            echo "| Windows arm64 | \`codenv-windows-arm64.zip\` |"
            echo
            echo "No installer: unzip, then run \`codenv\`. It is a single self-contained binary."
            echo
            echo "codenv is Windows-only by design: it is backed by Scoop and relies on Windows"
            echo "PATH semantics. It requires PowerShell and git."
            echo
            echo "Check your setup at any time with \`codenv doctor\`."
          } > "$notes"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$title" --notes-file "$notes"
          fi
          gh release view "$TAG" --repo "$REPO"